services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: redes2-server

    hostname: server

    cap_add:
      - NET_ADMIN

    ports:
      - "8443:443/tcp"
      - "8443:443/udp"
      - "5201:5201/tcp"
      - "5201:5201/udp"

    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server/certs:/etc/nginx/certs:ro
      - ./server/www:/usr/share/nginx/html:ro
      - ./results:/results

    networks:
      redes2-net:
        ipv4_address: 172.28.0.10

    command: >
      sh -c "
      iperf3 -s -D &&
      nginx -g 'daemon off;'
      "

  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: redes2-client

    hostname: client

    cap_add:
      - NET_ADMIN

    depends_on:
      - server

    volumes:
      - ./results:/results
      - ./experiments:/experiments

    networks:
      redes2-net:
        ipv4_address: 172.28.0.20

    stdin_open: true
    tty: true

    command: tail -f /dev/null


networks:
  redes2-net:
    driver: bridge

    ipam:
      config:
        - subnet: 172.28.0.0/24